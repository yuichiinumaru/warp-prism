name: warp_prism
publish_to: 'none'

environment:
  sdk: ^3.12.0

workspace:
  - packages/**
  - apps/**

dev_dependencies:
  melos: ^7.0.0

melos:
  command:
    bootstrap:
      usePubspecOverrides: true

  scripts:
    analyze:
      description: Run flutter analyze across all packages and apps.
      run: melos exec -- flutter analyze
      packageFilters:
        dirExists: lib

    format:
      description: Check Dart formatting across all packages and apps.
      run: melos exec -- dart format --set-exit-if-changed .
      packageFilters:
        dirExists: lib

    test:
      description: Run flutter test across all packages and apps.
      run: melos exec -- flutter test
      packageFilters:
        dirExists: test

    test-ui:
      description: Run tests for warp_prism_ui only.
      run: melos exec --scope warp_prism_ui -- flutter test

    test-observatory:
      description: Run tests for the Observatory app only.
      run: melos exec --scope warp_prism_observatory -- flutter test

    test-catalog:
      description: Run tests for the Catalog app only.
      run: melos exec --scope warp_prism_catalog -- flutter test

    test-cybercore:
      description: Run tests for the CyberCore app only.
      run: melos exec --scope warp_prism_cybercore -- flutter test

    test-boundaries:
      description: Run boundary test harness — architectural enforcement.
      run: melos exec --scope warp_prism_ui -- flutter test test/boundaries/boundary_test.dart

    test-fast:
      description: Quick local gate — test-ui and test-cybercore.
      run: melos exec --scope warp_prism_ui,warp_prism_cybercore -- flutter test

    validate:
      description: Full CI gate — format, analyze, and test all packages.
      run: melos run format && melos run analyze && melos run test
