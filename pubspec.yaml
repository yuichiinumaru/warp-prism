name: warp_prism
publish_to: 'none'

environment:
  sdk: ^3.12.0

workspace:
  - packages/**
  - apps/**

dev_dependencies:
  melos: ^7.0.0

melos:
  command:
    bootstrap:
      usePubspecOverrides: true

  scripts:
    analyze:
      description: >-
        Run flutter analyze across all packages and apps.
        Infos are non-fatal (package gate = zero errors/warnings per
        docs/governance/test-gate-matrix.md); prefer_const/deprecation infos
        remain tracked residual, not migration blockers.
      run: dart run melos exec --dir-exists=lib -- flutter analyze --no-fatal-infos

    format:
      description: Check Dart formatting across all packages and apps.
      run: dart run melos exec --dir-exists=lib -- dart format --set-exit-if-changed .

    test:
      description: Run flutter test across all packages and apps.
      run: dart run melos exec --dir-exists=test -- flutter test

    test-ui:
      description: Run tests for warp_prism_ui only.
      run: dart run melos exec --scope warp_prism_ui -- flutter test

    test-observatory:
      description: Run tests for the Observatory app only.
      run: dart run melos exec --scope warp_prism_observatory -- flutter test

    test-catalog:
      description: Run tests for the Catalog app only.
      run: dart run melos exec --scope warp_prism_catalog -- flutter test

    test-cybercore:
      description: Run tests for the CyberCore app only.
      run: dart run melos exec --scope warp_prism_cybercore -- flutter test

    test-boundaries:
      description: Run pure Dart boundary test harness - architectural enforcement.
      run: dart run packages/warp_prism_ui/test/boundaries/boundary_test.dart --repo-root .

    test-fast:
      description: Quick local gate - test-ui and test-cybercore.
      run: dart run melos run test-ui && dart run melos run test-cybercore

    validate:
      description: Full CI gate - format, analyze, and test all packages.
      run: dart run melos run format && dart run melos run analyze && dart run melos run test
