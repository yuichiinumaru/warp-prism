name: asw_observatory
description: ASW Observatory - Agent System Workspace visibility console
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  go_router: ^14.0.0
  flutter_riverpod: ^2.5.0
  yaml: ^3.1.2
  graphview: ^1.2.0
  fl_chart: ^0.68.0
  collection: ^1.18.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/mock_workspace/
    - assets/mock_workspace/.agents/agents/
    - assets/mock_workspace/.agents/skills/
    - assets/mock_workspace/.agents/workflows/
    - assets/mock_workspace/docs/tasks/00-planning/
    - assets/mock_workspace/docs/tasks/01-open/
    - assets/mock_workspace/docs/tasks/02-doing/
    - assets/mock_workspace/docs/tasks/03-review/
    - assets/mock_workspace/docs/tasks/04-completed/
    - assets/mock_workspace/docs/changelog/

  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
