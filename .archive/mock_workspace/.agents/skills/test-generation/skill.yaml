name: test-generation
description: Automated test case generation skill for creating comprehensive unit and integration tests.
version: 1.4.0

inputs:
  - name: source_file
    type: string
    description: Path to the source file to generate tests for
    required: true
  - name: test_framework
    type: string
    description: Testing framework to use
    enum: [jest, pytest, junit, vitest, mocha]
    default: jest
  - name: coverage_target
    type: number
    description: Target code coverage percentage
    default: 80
  - name: include_edge_cases
    type: boolean
    description: Whether to generate edge case tests
    default: true

outputs:
  - name: test_file
    type: string
    description: Generated test file content
  - name: test_cases
    type: array
    description: List of generated test cases
  - name: coverage_estimate
    type: number
    description: Estimated coverage percentage

steps:
  - name: analyze_source
    action: parse
    description: Analyze the source file structure and functions
    
  - name: identify_testables
    action: extract
    description: Identify testable units (functions, methods, classes)
    
  - name: generate_test_cases
    action: generate
    description: Generate test cases for each testable unit
    config:
      include_happy_path: true
      include_error_cases: true
      include_boundary_tests: true
      
  - name: generate_edge_cases
    action: generate
    description: Generate edge case tests
    condition: inputs.include_edge_cases
    
  - name: format_output
    action: format
    description: Format tests according to the specified framework

metadata:
  author: asw-team
  created: 2025-01-15
  updated: 2025-04-20
  tags:
    - testing
    - automation
    - quality
  used_by:
    - coder
