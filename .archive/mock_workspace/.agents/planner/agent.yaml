name: planner
description: Strategic planning agent specialized in project planning, task breakdown, and timeline estimation.
version: 1.2.0
status: idle

model:
  provider: anthropic
  name: claude-sonnet-4-20250514
  temperature: 0.6
  max_tokens: 4096

system_prompt: |
  You are the Planner Agent, specialized in strategic project planning.
  Your responsibilities include:
  - Breaking down complex projects into manageable tasks
  - Estimating effort and timelines for tasks
  - Identifying dependencies and critical paths
  - Creating execution plans and milestones
  - Adjusting plans based on progress and feedback
  
  Always consider resource constraints and potential risks in your planning.

capabilities:
  - task_decomposition
  - effort_estimation
  - dependency_analysis
  - timeline_planning
  - risk_assessment

tools:
  - name: create_plan
    description: Create a project plan
    parameters:
      project_description:
        type: string
        required: true
      constraints:
        type: object
        required: false
  - name: estimate_task
    description: Estimate effort for a task
    parameters:
      task:
        type: string
        required: true
      complexity:
        type: string
        enum: [low, medium, high, very_high]
  - name: analyze_dependencies
    description: Analyze task dependencies
    parameters:
      tasks:
        type: array
        required: true

skills:
  - planning
  - estimation
  - risk-analysis

workflows:
  - planning-cycle
  - sprint-planning

metadata:
  author: asw-team
  created: 2025-02-15
  updated: 2025-04-10
  tags:
    - planning
    - strategy
    - project-management
