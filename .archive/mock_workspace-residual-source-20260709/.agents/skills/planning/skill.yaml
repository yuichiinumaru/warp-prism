name: planning
description: Strategic project planning skill for breaking down complex tasks and creating actionable plans.
version: 1.0.2

inputs:
  - name: project_description
    type: string
    description: Description of the project or task to plan
    required: true
  - name: constraints
    type: object
    description: Resource and time constraints
    required: false
  - name: granularity
    type: string
    description: Level of task breakdown detail
    enum: [high_level, detailed, exhaustive]
    default: detailed

outputs:
  - name: plan
    type: object
    description: The structured project plan
  - name: tasks
    type: array
    description: List of tasks with estimates
  - name: dependencies
    type: array
    description: Task dependency graph
  - name: risks
    type: array
    description: Identified risks and mitigations

steps:
  - name: analyze_scope
    action: analyze
    description: Analyze the project scope and requirements
    
  - name: decompose_tasks
    action: decompose
    description: Break down the project into tasks
    
  - name: estimate_effort
    action: estimate
    description: Estimate effort for each task
    config:
      include_buffer: true
      buffer_percentage: 20
      
  - name: identify_dependencies
    action: analyze
    description: Identify task dependencies
    
  - name: assess_risks
    action: evaluate
    description: Assess potential risks
    
  - name: create_timeline
    action: schedule
    description: Create the project timeline

metadata:
  author: asw-team
  created: 2025-03-01
  updated: 2025-04-15
  tags:
    - planning
    - project-management
    - estimation
  used_by:
    - planner
    - orchestrator
