name: synthesis
description: Information synthesis skill for combining multiple sources into coherent, well-structured outputs.
version: 1.1.0

inputs:
  - name: sources
    type: array
    description: List of source materials to synthesize
    required: true
  - name: output_format
    type: string
    description: Desired output format
    enum: [summary, report, outline, structured_data]
    default: summary
  - name: max_length
    type: integer
    description: Maximum output length in words
    default: 500
  - name: focus_topics
    type: array
    description: Topics to prioritize in synthesis
    required: false

outputs:
  - name: synthesis
    type: string
    description: The synthesized output
  - name: sources_used
    type: array
    description: List of sources that contributed to the synthesis
  - name: confidence
    type: number
    description: Confidence score for the synthesis

steps:
  - name: preprocess_sources
    action: normalize
    description: Normalize and preprocess source materials
    
  - name: extract_key_points
    action: extract
    description: Extract key points from each source
    
  - name: identify_themes
    action: cluster
    description: Identify common themes across sources
    
  - name: resolve_conflicts
    action: reconcile
    description: Resolve conflicting information between sources
    
  - name: compose_output
    action: generate
    description: Compose the final synthesized output
    config:
      maintain_citations: true
      highlight_conflicts: false

metadata:
  author: asw-team
  created: 2025-02-01
  updated: 2025-05-10
  tags:
    - synthesis
    - analysis
    - research
  used_by:
    - researcher
    - orchestrator
