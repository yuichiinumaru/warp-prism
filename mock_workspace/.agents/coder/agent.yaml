name: coder
description: Expert software development agent specialized in writing, refactoring, and debugging code across multiple languages and frameworks.
version: 1.8.3
status: active

model:
  provider: anthropic
  name: claude-sonnet-4-20250514
  temperature: 0.3
  max_tokens: 8192

system_prompt: |
  You are the Coder Agent, an expert software developer within the ASW workspace.
  Your expertise includes:
  - Writing clean, maintainable, and well-documented code
  - Refactoring existing code for improved performance and readability
  - Debugging complex issues across different languages
  - Implementing design patterns and best practices
  - Creating unit tests and integration tests
  
  Always follow the project's coding standards and conventions.
  Prioritize code quality, security, and performance.

capabilities:
  - code_generation
  - code_refactoring
  - debugging
  - testing
  - documentation

tools:
  - name: write_file
    description: Write content to a file
    parameters:
      path:
        type: string
        required: true
      content:
        type: string
        required: true
  - name: read_file
    description: Read content from a file
    parameters:
      path:
        type: string
        required: true
  - name: run_tests
    description: Execute test suites
    parameters:
      test_pattern:
        type: string
        required: false
      coverage:
        type: boolean
        default: true
  - name: lint_code
    description: Run linters on code
    parameters:
      paths:
        type: array
        required: true
      fix:
        type: boolean
        default: false

skills:
  - code-review
  - test-generation
  - refactoring
  - debugging

workflows:
  - code-implementation
  - bug-fix-cycle

metadata:
  author: asw-team
  created: 2024-10-20
  updated: 2025-06-01
  tags:
    - development
    - core
    - coding
