name: code-implementation
description: Streamlined workflow for implementing new features or changes with built-in quality checks.
version: 1.2.0
status: active

trigger:
  type: event
  event: implementation_request
  inputs:
    - name: specification
      type: string
      required: true
    - name: target_files
      type: array
      required: false
    - name: branch_name
      type: string
      required: false

stages:
  - name: analyze_spec
    description: Analyze the implementation specification
    agent: orchestrator
    inputs:
      specification: "{{ trigger.specification }}"
    outputs:
      - implementation_plan
      - affected_files
      - estimated_complexity
    timeout: 180
    
  - name: implement
    description: Implement the changes
    agent: coder
    inputs:
      plan: "{{ stages.analyze_spec.outputs.implementation_plan }}"
      files: "{{ trigger.target_files or stages.analyze_spec.outputs.affected_files }}"
    outputs:
      - code_changes
      - new_files
    timeout: 1200
    
  - name: generate_tests
    description: Generate tests for new code
    agent: coder
    skill: test-generation
    inputs:
      source_files: "{{ stages.implement.outputs.code_changes | map('path') }}"
      coverage_target: 80
    outputs:
      - test_files
      - coverage_estimate
    timeout: 600
    
  - name: quick_review
    description: Quick automated review
    agent: reviewer
    skill: code-review
    inputs:
      files: "{{ stages.implement.outputs.code_changes | map('path') }}"
      focus_areas: [correctness, style]
      severity_threshold: error
    outputs:
      - blocking_issues
      - warnings
    timeout: 300
    
  - name: check_blocking
    description: Check for blocking issues
    type: decision
    condition: "stages.quick_review.outputs.blocking_issues | length == 0"
    branches:
      pass: finalize
      fail: fix_issues
      
  - name: fix_issues
    description: Fix blocking issues
    agent: coder
    inputs:
      issues: "{{ stages.quick_review.outputs.blocking_issues }}"
      code: "{{ stages.implement.outputs.code_changes }}"
    outputs:
      - fixed_code
    timeout: 600
    next: finalize
    
  - name: finalize
    description: Finalize the implementation
    type: output
    data:
      changes: "{{ stages.fix_issues.outputs.fixed_code or stages.implement.outputs.code_changes }}"
      tests: "{{ stages.generate_tests.outputs.test_files }}"
      coverage: "{{ stages.generate_tests.outputs.coverage_estimate }}"
      warnings: "{{ stages.quick_review.outputs.warnings }}"

metadata:
  author: asw-team
  created: 2025-02-20
  updated: 2025-04-25
  tags:
    - implementation
    - development
    - automation
  avg_duration_minutes: 30
  success_rate: 0.95
